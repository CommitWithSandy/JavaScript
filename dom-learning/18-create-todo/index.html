<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>18 - Todo Application | DOM Learning</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.6; padding: 20px; display: flex; justify-content: center; }
    .container { background: #ffffff; max-width: 800px; width: 100%; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h1 { color: #2c3e50; margin-bottom: 10px; font-size: 1.8rem; border-bottom: 2px solid #3498db; padding-bottom: 8px; }
    p.description { color: #666; margin-bottom: 20px; }
    .section { background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    
    /* Todo Form Controls */
    .todo-form { display: flex; gap: 10px; margin-bottom: 20px; }
    .todo-form input { flex: 1; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; }
    .todo-form button { background-color: #3498db; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: 600; }
    .todo-form button:hover { background-color: #2980b9; }

    /* Todo List Styling */
    ul.todo-list { list-style: none; padding: 0; }
    ul.todo-list li {
      background: white;
      border: 1px solid #cbd5e1;
      padding: 12px 16px;
      margin-bottom: 10px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }
    
    /* Completed Todo Task Style */
    ul.todo-list li.completed {
      background-color: #f1f5f9;
      text-decoration: line-through;
      color: #94a3b8;
      border-color: #e2e8f0;
    }

    .todo-text { flex: 1; cursor: pointer; font-size: 1.05rem; }

    .btn-delete {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      margin-left: 10px;
    }
    .btn-delete:hover { background-color: #c0392b; }

    /* Error validation alert */
    .error-msg { color: #e74c3c; font-size: 0.9rem; margin-top: -15px; margin-bottom: 15px; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>18 - Practice Project: Todo List</h1>
    <p class="description">Combining DOM selection, creation, attributes, classList, event listeners, and delegation in one mini app.</p>

    <div class="section">
      <form id="todo-form" class="todo-form">
        <input type="text" id="todo-input" placeholder="What needs to be done?">
        <button type="submit">Add Task</button>
      </form>
      <div id="error-message" class="error-msg">⚠️ Please enter a task before adding!</div>

      <h3>Your Tasks:</h3>
      <ul id="todo-list" class="todo-list">
        <!-- Dynamic Todo items will be appended here -->
        <li>
          <span class="todo-text">Learn JavaScript DOM Basics</span>
          <button class="btn-delete">Delete</button>
        </li>
      </ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
