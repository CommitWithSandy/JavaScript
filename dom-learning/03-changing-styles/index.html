<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>03 - Changing Styles | DOM Learning</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.6; padding: 20px; display: flex; justify-content: center; }
    .container { background: #ffffff; max-width: 800px; width: 100%; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h1 { color: #2c3e50; margin-bottom: 10px; font-size: 1.8rem; border-bottom: 2px solid #3498db; padding-bottom: 8px; }
    p.description { color: #666; margin-bottom: 20px; }
    .section { background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; min-height: 220px; }
    
    /* Target Box for Style Manipulations */
    #target-box {
      width: 150px;
      height: 150px;
      background-color: #3498db;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-size: 16px;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .button-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
    button { background-color: #3498db; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 0.95rem; font-weight: 500; }
    button:hover { background-color: #2980b9; }
    .output-box { background-color: #1e293b; color: #38bdf8; padding: 15px; border-radius: 6px; font-family: 'Courier New', Courier, monospace; font-size: 0.9rem; min-height: 60px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="container">
    <h1>03 - Changing Styles</h1>
    <p class="description">Learn how to manipulate CSS inline styles using JavaScript element.style.</p>

    <div class="section">
      <div id="target-box">I am a Box</div>
    </div>

    <div class="button-group">
      <button id="btn-bg">Change Background Color</button>
      <button id="btn-color">Change Text Color</button>
      <button id="btn-font">Change Font Size</button>
      <button id="btn-size">Change Width & Height</button>
      <button id="btn-border">Change Border</button>
      <button id="btn-reset">Reset Styles</button>
    </div>

    <h3>Applied Style Info:</h3>
    <div id="output" class="output-box">Click buttons above to change styles dynamically.</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
