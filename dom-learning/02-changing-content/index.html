<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>02 - Changing Content | DOM Learning</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.6; padding: 20px; display: flex; justify-content: center; }
    .container { background: #ffffff; max-width: 800px; width: 100%; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h1 { color: #2c3e50; margin-bottom: 10px; font-size: 1.8rem; border-bottom: 2px solid #3498db; padding-bottom: 8px; }
    p.description { color: #666; margin-bottom: 20px; }
    .section { background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    .button-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
    button { background-color: #3498db; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 0.95rem; font-weight: 500; }
    button:hover { background-color: #2980b9; }
    .display-area { background: #ffffff; border: 2px dashed #cbd5e1; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
    .hidden-text { display: none; }
    .output-box { background-color: #1e293b; color: #38bdf8; padding: 15px; border-radius: 6px; font-family: 'Courier New', Courier, monospace; font-size: 0.9rem; min-height: 80px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="container">
    <h1>02 - Changing Content</h1>
    <p class="description">Learn how to read and modify text and HTML content inside elements.</p>

    <div class="section">
      <h2 id="demo-heading">Original Heading Title</h2>
      
      <div id="demo-box" class="display-area">
        Original paragraph content. <span class="hidden-text">(This part has CSS display: none)</span>
      </div>
    </div>

    <div class="button-group">
      <button id="btn-text-content">Use textContent</button>
      <button id="btn-inner-text">Use innerText</button>
      <button id="btn-inner-html">Use innerHTML</button>
      <button id="btn-reset">Reset Original</button>
    </div>

    <h3>Inspection Output:</h3>
    <div id="output" class="output-box">Click any button above to see content changes and compare behaviors.</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
