<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>12 - Form Events | DOM Learning</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.6; padding: 20px; display: flex; justify-content: center; }
    .container { background: #ffffff; max-width: 800px; width: 100%; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h1 { color: #2c3e50; margin-bottom: 10px; font-size: 1.8rem; border-bottom: 2px solid #3498db; padding-bottom: 8px; }
    p.description { color: #666; margin-bottom: 20px; }
    .section { background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; color: #475569; }
    input[type="text"], input[type="email"], input[type="number"], select {
      width: 100%;
      max-width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    input:focus, select:focus {
      border-color: #3498db;
      outline: none;
    }

    button { background-color: #3498db; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: 500; }
    button:hover { background-color: #2980b9; }

    .output-box { background-color: #1e293b; color: #38bdf8; padding: 15px; border-radius: 6px; font-family: 'Courier New', Courier, monospace; font-size: 0.9rem; min-height: 100px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="container">
    <h1>12 - Form Events</h1>
    <p class="description">Learn form control events: submit, input, change, focus, blur, and preventDefault().</p>

    <div class="section">
      <form id="user-form">
        <div class="form-group">
          <label for="user-name">Full Name:</label>
          <input type="text" id="user-name" name="name" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
          <label for="user-email">Email Address:</label>
          <input type="email" id="user-email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="user-age">Age:</label>
          <input type="number" id="user-age" name="age" placeholder="Enter age" min="1">
        </div>

        <div class="form-group">
          <label for="user-role">Role:</label>
          <select id="user-role" name="role">
            <option value="developer">Developer</option>
            <option value="student">Student</option>
            <option value="designer">Designer</option>
          </select>
        </div>

        <button type="submit">Submit Form</button>
      </form>
    </div>

    <h3>Form Event Output:</h3>
    <div id="output" class="output-box">Interact with form inputs or submit the form to see real-time updates.</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
