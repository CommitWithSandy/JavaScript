<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10 - Mouse Events | DOM Learning</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.6; padding: 20px; display: flex; justify-content: center; }
    .container { background: #ffffff; max-width: 800px; width: 100%; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h1 { color: #2c3e50; margin-bottom: 10px; font-size: 1.8rem; border-bottom: 2px solid #3498db; padding-bottom: 8px; }
    p.description { color: #666; margin-bottom: 20px; }
    .section { background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
    
    /* Interactive Mouse Box */
    #mouse-box {
      width: 100%;
      height: 180px;
      background-color: #3498db;
      color: white;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 1.1rem;
      font-weight: bold;
      user-select: none;
      cursor: crosshair;
      transition: background-color 0.2s ease;
    }
    
    .inner-child {
      background: rgba(255, 255, 255, 0.2);
      padding: 10px 15px;
      border-radius: 6px;
      margin-top: 10px;
      font-size: 0.9rem;
      pointer-events: auto;
    }

    .output-box { background-color: #1e293b; color: #38bdf8; padding: 15px; border-radius: 6px; font-family: 'Courier New', Courier, monospace; font-size: 0.9rem; min-height: 100px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="container">
    <h1>10 - Mouse Events</h1>
    <p class="description">Explore all mouse event types and learn the difference between mouseenter vs mouseover.</p>

    <div class="section">
      <div id="mouse-box">
        <span>Interactive Mouse Box</span>
        <div class="inner-child">Inner Child Element (Hover over me to test bubbling!)</div>
      </div>
    </div>

    <h3>Mouse Activity Display:</h3>
    <div id="output" class="output-box">Move, click, or hover over the blue box above to see events trigger in real time.</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
