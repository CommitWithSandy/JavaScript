<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>15 - Event Delegation | DOM Learning</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.6; padding: 20px; display: flex; justify-content: center; }
    .container { background: #ffffff; max-width: 800px; width: 100%; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h1 { color: #2c3e50; margin-bottom: 10px; font-size: 1.8rem; border-bottom: 2px solid #3498db; padding-bottom: 8px; }
    p.description { color: #666; margin-bottom: 20px; }
    .section { background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    
    ul.item-list { list-style: none; padding: 0; margin-top: 15px; }
    ul.item-list li {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 10px 15px;
      margin-bottom: 8px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .btn-delete {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-delete:hover { background-color: #c0392b; }

    .button-group { display: flex; gap: 10px; margin-bottom: 15px; }
    button.primary { background-color: #2ecc71; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; }
    button.primary:hover { background-color: #27ae60; }

    .output-box { background-color: #1e293b; color: #38bdf8; padding: 15px; border-radius: 6px; font-family: 'Courier New', Courier, monospace; font-size: 0.9rem; min-height: 80px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="container">
    <h1>15 - Event Delegation</h1>
    <p class="description">Learn how to attach a SINGLE event listener to a parent element to manage all current and future child elements.</p>

    <div class="button-group">
      <input type="text" id="item-input" placeholder="Enter fruit name..." style="padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; width: 220px;">
      <button id="btn-add" class="primary">Add Dynamic Item</button>
    </div>

    <div class="section">
      <h3>Fruit List (Single Listener attached to &lt;ul&gt;):</h3>
      <ul id="fruit-list" class="item-list">
        <li><span>Apple</span> <button class="btn-delete">Delete</button></li>
        <li><span>Banana</span> <button class="btn-delete">Delete</button></li>
        <li><span>Cherry</span> <button class="btn-delete">Delete</button></li>
      </ul>
    </div>

    <h3>Delegation Action Log:</h3>
    <div id="output" class="output-box">Click any delete button or item in the list above.</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
