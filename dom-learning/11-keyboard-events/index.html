<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>11 - Keyboard Events | DOM Learning</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.6; padding: 20px; display: flex; justify-content: center; }
    .container { background: #ffffff; max-width: 800px; width: 100%; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h1 { color: #2c3e50; margin-bottom: 10px; font-size: 1.8rem; border-bottom: 2px solid #3498db; padding-bottom: 8px; }
    p.description { color: #666; margin-bottom: 20px; }
    .section { background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    
    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 1.05rem;
      border: 2px solid #cbd5e1;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s ease;
    }
    input[type="text"]:focus {
      border-color: #3498db;
    }

    .output-box { background-color: #1e293b; color: #38bdf8; padding: 15px; border-radius: 6px; font-family: 'Courier New', Courier, monospace; font-size: 0.9rem; min-height: 100px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="container">
    <h1>11 - Keyboard Events</h1>
    <p class="description">Learn how to capture user keyboard input using keydown and keyup events.</p>

    <div class="section">
      <label for="text-input" style="font-weight: 600; display: block; margin-bottom: 8px;">Type in the input box below:</label>
      <input type="text" id="text-input" placeholder="Click here and start typing...">
    </div>

    <h3>Keyboard Event Live Log:</h3>
    <div id="output" class="output-box">Focus the text box and press keys to see event data.</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
