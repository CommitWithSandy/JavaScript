<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>colorChange</title>
    <style>
        *{
            place-items: center;
        }
        h1{
            text-align: center;
        }
        .box{
            width: 50px;
            height: 50px;
            background-color: #fff;
            padding: 40px;
            margin: 40px;
            border: 2px solid ;
            box-sizing: border-box;
            border-color: black;
            float: left;
        }
        #orange{
            background-color: orange;
        }
        #white{
            background-color: #fff;
        }
        #gray{
            background-color: gray;
        }
        #blue{
            background-color: blue;
        }
        #green{
            background-color: green;
        }
        #red{
            background-color: red;
        }
    </style>
</head>
<body>
    <h1>colorChange Background</h1>
    <div id="orange" class="box"></div>
    <div id="white" class="box"></div>
    <div id="green" class="box"></div>
    <div id="gray" class="box"></div>
    <div id="blue" class="box"></div>
    <div id="red" class="box"></div>


    <h2>Change the background-color using box color click it</h2>
</body>
<script src="script.js"></script>
</html>
