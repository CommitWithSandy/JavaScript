<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body style="background-color: rgb(32, 31, 31); color: white;">
    <ul class="lang">
        <li>Java</li>
    </ul>
</body>
<script>
    // Add
    // Normal Way
    function addlang(langName){
        const li = document.createElement('li');
        li.innerHTML = `${langName}`
        document.querySelector('.lang')
        .appendChild(li)
    }
    addlang("python")
    addlang("Javascript")

    // optimized way 
    function addoptiLang(langName){
       const li = document.createElement('li');
       li.appendChild(document.createTextNode(langName))
        document.querySelector('.lang')
        .appendChild(li)
    }
    addoptiLang("golang")

    // Edit
    const secLang= document.querySelector('li:nth-child(2)')
    // secLang.innerHTML = "Mojo"

    const firstLang = document.querySelector("li:first-child")
    // firstLang.outerHTML = '<li>TypeScript</li>'

    // new Optimization Approach way
    const newli = document.createElement('li')
    newli.textContent = "Mojo"
    secLang.replaceWith(newli)

    // Remove
    const lastLang = document.querySelector("li:last-child")
    // lastLang.remove()
</script>
</html>
